name: CI
on:
  workflow_dispatch:
  # See: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#pull_request.
  pull_request:
  # See: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#push.
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CI_FAILFAST_TEST_LEAVE_DANGLING: 1  # GHA does not care about dangling processes and setting this variable avoids killing the CI script itself on error
  REPO_USE_WARP_RUNNERS: 'bitcoin/bitcoin' # Use warp runners for this repo, instead of falling back to the slow GHA runners

defaults:
  run:
    # Enforce fail-fast behavior for all platforms.
    # See: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

jobs:
  runners:
    name: '[meta] determine runners'
    runs-on: ubuntu-slim
    outputs:
      provider: ${{ steps.runners.outputs.provider }}
      ancestor-batches: ${{ steps.ancestors.outputs.batches }}
      qa-assets-commit: ${{ steps.qa-assets.outputs.commit }}
    steps:
      - &ANNOTATION_PR_NUMBER
        name: Annotate with pull request number
        # This annotation is machine-readable and can be used to assign a check
        # run to its corresponding pull request. Running in all check runs is
        # required, because check re-runs discard the annotations of other
        # tasks in the test suite.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice title=debug_pull_request_number_str::${{ github.event.number }}"
          fi
      - id: runners
        run: |
          if [[ "${REPO_USE_WARP_RUNNERS}" == "${{ github.repository }}" ]]; then
            echo "provider=warp" >> "$GITHUB_OUTPUT"
            echo "::notice title=Runner Selection::Using Warp Runners"
          else
            echo "provider=gha" >> "$GITHUB_OUTPUT"
            echo "::notice title=Runner Selection::Using GitHub-hosted runners"
          fi
      - name: Resolve the QA corpus revision for this run
        id: qa-assets
        # Replay jobs require this revision. Other profiles can still run if the archive is unavailable.
        continue-on-error: true
        run: |
          for delay in 1 2 4; do
            if revision=$(git ls-remote --exit-code https://github.com/bitcoin-core/qa-assets HEAD | cut -f1) && [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "commit=$revision" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$delay"
          done
          exit 1
      - name: Size ancestor test batches
        id: ancestors
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits || 0 }}
          MIN_BATCHES: ${{ github.event.pull_request.commits > 8 && 4 || github.event.pull_request.commits > 4 && 2 || 1 }}
        run: |
          # The main matrix tests the head. Target six earlier revisions per job to leave time for a cold build.
          commits_per_job=6
          ancestors=$(( PR_COMMITS > 0 ? PR_COMMITS - 1 : 0 ))
          batches=$(( (ancestors + commits_per_job - 1) / commits_per_job ))
          if (( batches < MIN_BATCHES )); then batches=$MIN_BATCHES; fi
          if (( batches > 256 )); then batches=256; fi
          printf 'batches=[%s]\n' "$(seq -s, "$batches")" >> "$GITHUB_OUTPUT"

  test-ancestor-batch:
    name: test ancestor commits (batch ${{ matrix.batch }})
    needs: runners
    runs-on: ${{ needs.runners.outputs.provider == 'warp' && 'warp-ubuntu-latest-x64-8x' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.runners.outputs.ancestor-batches) }}
    env:
      BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
      TEST_RUNNER_TIMEOUT_FACTOR: 40
      TEST_RUNNER_PORT_MIN: "14000"  # Use a larger port range to avoid colliding with other CI services.
    if: github.event_name == 'pull_request' && github.event.pull_request.commits != 1
    timeout-minutes: 360  # Use maximum time, see https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idtimeout-minutes.
    steps:
      - name: Determine fetch depth
        run: echo "FETCH_DEPTH=$((${{ github.event.pull_request.commits }} + 2))" >> "$GITHUB_ENV"
      - *ANNOTATION_PR_NUMBER
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ env.FETCH_DEPTH }}
      - name: Select ancestor commits
        id: range
        env:
          BATCH: ${{ matrix.batch }}
          BATCHES: ${{ strategy.job-total }}
        run: |
          git fetch --no-tags origin "$BASE_COMMIT"
          tip=$(git rev-parse HEAD^)
          # The main matrix covers the PR head. A merge brings in changes
          # tested by another PR, so check the first-parent series after it.
          last_merge=$(git rev-list --first-parent --merges -n1 "$BASE_COMMIT..$tip")
          git rev-list --first-parent --reverse "${last_merge:-$BASE_COMMIT}..$tip" > "$RUNNER_TEMP/ancestor-range"
          mapfile -t ancestors < "$RUNNER_TEMP/ancestor-range"
          begin=$(( ${#ancestors[@]} * (BATCH - 1) / BATCHES ))
          end=$(( ${#ancestors[@]} * BATCH / BATCHES ))
          for ((i=begin; i<end; i++)); do
            echo "${ancestors[i]}"
          done > "$RUNNER_TEMP/ancestor-commits"
          echo "count=$((end - begin))" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        if: steps.range.outputs.count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install clang mold ccache build-essential cmake ninja-build pkgconf python3-zmq libevent-dev libboost-dev libsqlite3-dev systemtap-sdt-dev libzmq3-dev qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev capnproto libcapnp-dev -y
          sudo pip3 install --break-system-packages pycapnp
      - name: Compile and run tests
        if: steps.range.outputs.count != '0'
        run: |
          git config user.email "ci@example.com"
          git config user.name "CI"
          # Keep the PR head's test driver while building and testing each ancestor's sources.
          cp .github/ci-test-each-commit-exec.py "$RUNNER_TEMP/ci-test-each-commit-exec.py"
          while read -r revision; do
            git checkout --detach "$revision"
            git merge --no-commit --no-ff "$BASE_COMMIT"
            python3 "$RUNNER_TEMP/ci-test-each-commit-exec.py"
            if git rev-parse --verify -q MERGE_HEAD >/dev/null; then
              git merge --abort
            fi
          done < "$RUNNER_TEMP/ancestor-commits"

  test-each-commit:
    name: 'test ancestor commits'
    needs: test-ancestor-batch
    if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.commits != 1
    runs-on: ubuntu-slim
    steps:
      - name: Check all ancestor batches
        env:
          RESULT: ${{ needs.test-ancestor-batch.result }}
        run: test "$RESULT" = success

  macos-native-arm64:
    name: ${{ matrix.job-name }}
    # Use any image to support the xcode-select below, but hardcode version to avoid silent upgrades (and breaks).
    # See: https://github.com/actions/runner-images#available-images.
    runs-on: macos-15

    # When a contributor maintains a fork of the repo, any pull request they make
    # to their own fork, or to the main repository, will trigger two CI runs:
    # one for the branch push and one for the pull request.
    # This can be avoided by setting SKIP_BRANCH_PUSH=true as a custom env variable
    # in Github repository settings.
    if: ${{ vars.SKIP_BRANCH_PUSH != 'true' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        job-type: [standard, fuzz]
        include:
          - job-type: standard
            file-env: './ci/test/00_setup_env_mac_native.sh'
            job-name: 'macOS native'
          - job-type: fuzz
            file-env: './ci/test/00_setup_env_mac_native_fuzz.sh'
            job-name: 'macOS native, fuzz'

    env:
      DANGER_RUN_CI_ON_HOST: 1
      BASE_ROOT_DIR: ${{ github.workspace }}/repo_archive

    steps:
      - *ANNOTATION_PR_NUMBER

      - &CHECKOUT
        name: Checkout
        uses: actions/checkout@v6
        with:
          # Ensure the latest merged pull request state is used, even on re-runs.
          ref: &CHECKOUT_REF_TMPL ${{ github.event_name == 'pull_request' && github.ref || '' }}

      - name: Clang version
        run: |
          # Use the latest Xcode supported by the version of macOS denoted in
          # doc/release-notes-empty-template.md and providing at least the
          # minimum clang version denoted in doc/dependencies.md.
          # See: https://developer.apple.com/documentation/xcode-release-notes/xcode-16_2-release-notes
          sudo xcode-select --switch /Applications/Xcode_16.2.app
          clang --version

      - name: Install Homebrew packages
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          # A workaround for "The `brew link` step did not complete successfully" error.
          brew install --quiet python@3 || brew link --overwrite python@3
          brew install --quiet coreutils ninja pkgconf ccache boost libevent zeromq qt@6 qrencode capnp

      - name: Set Ccache directory
        run: echo "CCACHE_DIR=${RUNNER_TEMP}/ccache_dir" >> "$GITHUB_ENV"

      - name: Restore Ccache cache
        id: ccache-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ github.job }}-${{ matrix.job-type }}-ccache-${{ github.run_id }}
          restore-keys: ${{ github.job }}-${{ matrix.job-type }}-ccache-

      - name: Create git archive
        run: |
          git log -1
          git archive --format=tar --prefix=repo_archive/ --output=repo.tar HEAD
          tar -xf repo.tar

      - name: CI script
        run: |
          cd repo_archive
          ./ci/test_run_all.sh
        env:
          FILE_ENV: ${{ matrix.file-env }}

      - name: Save Ccache cache
        uses: actions/cache/save@v5
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.CCACHE_DIR }}
          # https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
          key: ${{ github.job }}-${{ matrix.job-type }}-ccache-${{ github.run_id }}

  windows-native-dll:
    name: ${{ matrix.job-name }}
    runs-on: windows-2025-vs2026

    if: ${{ vars.SKIP_BRANCH_PUSH != 'true' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

    env:
      PYTHONUTF8: 1
      TEST_RUNNER_TIMEOUT_FACTOR: 40

    strategy:
      fail-fast: false
      matrix:
        job-type: [standard, fuzz]
        include:
          - job-type: standard
            job-name: 'Windows native, VS'
          - job-type: fuzz
            job-name: 'Windows native, fuzz, VS'

    steps:
      - *ANNOTATION_PR_NUMBER

      - *CHECKOUT

      - &IMPORT_VS_ENV
        name: Import Visual Studio env vars
        run: py -3 .github/ci-windows.py "standard" github_import_vs_env

      - name: Get tool information
        run: |
          set -o errexit -o pipefail -o xtrace -o nounset

          cmake -version | tee cmake_version
          echo '---'
          msbuild.exe -version | tee msbuild_version
          echo "${VCToolsVersion-}" | tee toolset_version
          py -3 --version
          bash --version

      - name: Using vcpkg with MSBuild
        run: |
          echo "set(VCPKG_BUILD_TYPE release)" >> "${VCPKG_INSTALLATION_ROOT}/triplets/x64-windows.cmake"
          # Workaround for libevent, which requires CMake 3.1 but is incompatible with CMake >= 4.0.
          sed -i '1s/^/set(ENV{CMAKE_POLICY_VERSION_MINIMUM} 3.5)\n/' "${VCPKG_INSTALLATION_ROOT}/scripts/ports.cmake"

      - name: Set VCPKG_ROOT
        run: |
          echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"

      - name: Restore vcpkg tools cache
        id: vcpkg-tools-cache
        uses: actions/cache/restore@v5
        with:
          path: C:/vcpkg/downloads/tools
          key: ${{ github.job }}-vcpkg-tools-${{ github.run_id }}
          restore-keys: ${{ github.job }}-vcpkg-tools-

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v5
        id: vcpkg-binary-cache
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ github.job }}-vcpkg-binary-${{ hashFiles('cmake_version', 'msbuild_version', 'toolset_version', 'vcpkg.json') }}

      - name: Generate build system
        run: |
          py -3 .github/ci-windows.py ${{ matrix.job-type }} generate

      - name: Save vcpkg binary cache
        uses: actions/cache/save@v5
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && steps.vcpkg-binary-cache.outputs.cache-hit != 'true' && matrix.job-type == 'standard'
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ github.job }}-vcpkg-binary-${{ hashFiles('cmake_version', 'msbuild_version', 'toolset_version', 'vcpkg.json') }}

      - name: Save vcpkg tools cache
        uses: actions/cache/save@v5
        # Only save cache from one job as they share tools. If the matrix is expanded to jobs with unique tools, this may need amending.
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && steps.vcpkg-tools-cache.outputs.cache-hit != 'true' && matrix.job-type == 'standard'
        with:
          path: C:/vcpkg/downloads/tools
          key: ${{ github.job }}-vcpkg-tools-${{ github.run_id }}

      - name: Build
        run: |
          py -3 .github/ci-windows.py ${{ matrix.job-type }} build

      - name: Check executable manifests
        run: |
          py -3 .github/ci-windows.py ${{ matrix.job-type }} check_manifests

      - name: Prepare tests
        run: |
          py -3 .github/ci-windows.py ${{ matrix.job-type }} prepare_tests

      - name: Run native network, GUI and wallet smoke checks
        if: matrix.job-type == 'standard'
        run: py -3 .github/ci-windows-smoke.py --bindir build/bin/Release --work-dir "${RUNNER_TEMP}/en-native-smoke"

      - name: Reopen a saved wallet in the native GUI
        if: matrix.job-type == 'standard'
        run: py -3 .github/ci-windows-smoke.py --verify-wallet-restart --bindir build/bin/Release --work-dir "${RUNNER_TEMP}/en-native-wallet-restart"

      - name: Run tests
        env:
          TEST_RUNNER_EXTRA: "--timeout-factor=${{ env.TEST_RUNNER_TIMEOUT_FACTOR }} ${{ case(github.event_name == 'pull_request', '', '--extended') }}"
        run: |
          py -3 .github/ci-windows.py ${{ matrix.job-type }} run_tests

  record-frozen-commit:
    # Record frozen commit, so that the native tests on cross-builds can run on
    # the exact same commit id of the build.
    name: '[meta] record frozen commit'
    runs-on: ubuntu-slim
    outputs:
      commit: ${{ steps.record-commit.outputs.commit }}
    steps:
      - *ANNOTATION_PR_NUMBER
      - *CHECKOUT
      - name: Record commit
        id: record-commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-cross:
    name: 'Windows-cross to x86_64, ${{ matrix.crt }}'
    needs: [runners, record-frozen-commit]
    runs-on: ${{ needs.runners.outputs.provider == 'warp' && 'warp-ubuntu-latest-x64-4x' || 'ubuntu-latest' }}
    if: ${{ vars.SKIP_BRANCH_PUSH != 'true' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

    strategy:
      fail-fast: false
      matrix:
        crt: [msvcrt, ucrt]
        include:
          - crt: msvcrt
            file-env: './ci/test/00_setup_env_win64_msvcrt.sh'
            artifact-name: 'x86_64-w64-mingw32-executables'
          - crt: ucrt
            file-env: './ci/test/00_setup_env_win64.sh'
            artifact-name: 'x86_64-w64-mingw32ucrt-executables'

    env:
      FILE_ENV: ${{ matrix.file-env }}
      DANGER_CI_ON_HOST_FOLDERS: 1

    steps:
      - *ANNOTATION_PR_NUMBER

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.record-frozen-commit.outputs.commit }}

      - name: Configure environment
        uses: ./.github/actions/configure-environment

      - name: Restore caches
        id: restore-cache
        uses: ./.github/actions/cache/restore
        with:
          provider: ${{ needs.runners.outputs.provider }}

      - name: Configure Docker
        uses: ./.github/actions/configure-docker
        with:
          provider: ${{ needs.runners.outputs.provider }}

      - name: CI script
        run: ./ci/test_run_all.sh

      - name: Save caches
        uses: ./.github/actions/cache/save
        with:
          provider: ${{ needs.runners.outputs.provider }}

      - name: Upload built executables
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}-${{ github.run_id }}
          path: |
            ${{ env.BASE_BUILD_DIR }}/bin/*.dll
            ${{ env.BASE_BUILD_DIR }}/bin/*.exe
            ${{ env.BASE_BUILD_DIR }}/src/secp256k1/bin/*.exe
            ${{ env.BASE_BUILD_DIR }}/src/univalue/*.exe
            ${{ env.BASE_BUILD_DIR }}/test/config.ini
            ${{ env.BASE_BUILD_DIR }}/*-win64-setup.exe
            ${{ env.BASE_BUILD_DIR }}/windows-installer-path.txt

  windows-native-test:
    name: 'Windows, ${{ matrix.crt }}, test cross-built'
    runs-on: windows-2022
    needs: [windows-cross, record-frozen-commit]

    strategy:
      fail-fast: false
      matrix:
        crt: [msvcrt, ucrt]
        include:
          - crt: msvcrt
            artifact-name: 'x86_64-w64-mingw32-executables'
          - crt: ucrt
            artifact-name: 'x86_64-w64-mingw32ucrt-executables'

    env:
      PYTHONUTF8: 1
      TEST_RUNNER_TIMEOUT_FACTOR: 40

    steps:
      - *ANNOTATION_PR_NUMBER

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.record-frozen-commit.outputs.commit }}

      - name: Download built executables
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact-name }}-${{ github.run_id }}

      - name: Run sugarchaind.exe
        run: py -3 .github/ci-windows-cross.py print_version

      - *IMPORT_VS_ENV

      - name: Check executable manifests
        run: py -3 .github/ci-windows-cross.py check_manifests

      - name: Prepare Windows test environment
        run: py -3 .github/ci-windows-cross.py prepare_tests

      - name: Run native network, GUI and wallet smoke checks
        run: py -3 .github/ci-windows-smoke.py --bindir bin --work-dir "${RUNNER_TEMP}/en-cross-smoke-${{ matrix.crt }}"

      - name: Reopen a saved wallet in the native GUI
        run: py -3 .github/ci-windows-smoke.py --verify-wallet-restart --bindir bin --work-dir "${RUNNER_TEMP}/en-cross-wallet-restart-${{ matrix.crt }}"

      - name: Verify installed applications and installer lifecycle
        run: |
          py -3 .github/ci-windows-installer.py --with-wallet-restart \
            --installer "$(basename "$(cat windows-installer-path.txt)")" \
            --work-dir "${RUNNER_TEMP}/en-installer-${{ matrix.crt }}"

      - name: Run unit tests
        run: py -3 .github/ci-windows-cross.py run_unit_tests

      - name: Run functional tests
        env:
          TEST_RUNNER_EXTRA: "--timeout-factor=${{ env.TEST_RUNNER_TIMEOUT_FACTOR }} ${{ case(github.event_name == 'pull_request', '', '--extended') }}"
        run: |
          py -3 .github/ci-windows-cross.py run_functional_tests

  ci-matrix:
    name: ${{ matrix.name }}
    needs: runners
    runs-on: ${{ needs.runners.outputs.provider == 'warp' && matrix.warp-runner || matrix.fallback-runner }}
    if: ${{ vars.SKIP_BRANCH_PUSH != 'true' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: ${{ matrix.timeout-minutes }}

    env:
      DANGER_CI_ON_HOST_FOLDERS: 1
      FILE_ENV: ${{ matrix.file-env }}
      ARMHF_PROBE_IMAGE: ${{ matrix.armhf-probe-image }}
      FUZZ_TESTS_CONFIG: ${{ matrix.replay-args }}
      REPLAY_CORPUS_SHARD: ${{ matrix.replay-shard }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'iwyu'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_iwyu.sh'

          - name: '32 bit ARM'
            warp-runner: 'ubuntu-24.04-arm' # Warp's Arm runners don't support 32-bit mode currently
            fallback-runner: 'ubuntu-24.04-arm'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_arm.sh'
            armhf-probe-image: mirror.gcr.io/debian:trixie-slim@sha256:ced25bc1bff26885d07c82647bc5ad766731d578e8cbc0d02b2e45b2095eaa67
            provider: 'gha'

          - name: 'ASan + LSan + UBSan + integer'
            warp-runner: 'warp-ubuntu-2404-x64-8x' # has to match container in ci/test/00_setup_env_native_asan.sh for tracing tools
            fallback-runner: 'ubuntu-24.04'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_asan.sh'

          - name: 'macOS-cross to arm64'
            warp-runner: 'warp-ubuntu-latest-x64-4x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_mac_cross.sh'

          - name: 'macOS-cross to x86_64'
            warp-runner: 'warp-ubuntu-latest-x64-4x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_mac_cross_intel.sh'

          - name: 'No wallet'
            warp-runner: 'warp-ubuntu-latest-x64-4x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_nowallet.sh'

          - name: 'i686, no IPC'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 180
            file-env: './ci/test/00_setup_env_i686_no_ipc.sh'

          - name: 'fuzzer,address,undefined,integer'
            warp-runner: 'warp-ubuntu-latest-x64-16x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 360
            file-env: './ci/test/00_setup_env_native_fuzz.sh'
            replay-args: '--exclude=p2p_headers_presync'

          # Split the full header pre-sync corpus across independent runners.
          - name: 'fuzzer,address,undefined,integer (header pre-sync 1/4)'
            warp-runner: 'warp-ubuntu-latest-x64-16x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 360
            file-env: './ci/test/00_setup_env_native_fuzz.sh'
            replay-args: 'p2p_headers_presync'
            replay-shard: '1/4'
            cache-restore-only: true

          - name: 'fuzzer,address,undefined,integer (header pre-sync 2/4)'
            warp-runner: 'warp-ubuntu-latest-x64-16x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 360
            file-env: './ci/test/00_setup_env_native_fuzz.sh'
            replay-args: 'p2p_headers_presync'
            replay-shard: '2/4'
            cache-restore-only: true

          - name: 'fuzzer,address,undefined,integer (header pre-sync 3/4)'
            warp-runner: 'warp-ubuntu-latest-x64-16x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 360
            file-env: './ci/test/00_setup_env_native_fuzz.sh'
            replay-args: 'p2p_headers_presync'
            replay-shard: '3/4'
            cache-restore-only: true

          - name: 'fuzzer,address,undefined,integer (header pre-sync 4/4)'
            warp-runner: 'warp-ubuntu-latest-x64-16x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 360
            file-env: './ci/test/00_setup_env_native_fuzz.sh'
            replay-args: 'p2p_headers_presync'
            replay-shard: '4/4'
            cache-restore-only: true

          - name: 'Sugarchain legacy wallet compatibility'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_previous_releases.sh'

          - name: 'Alpine (musl)'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 150
            file-env: './ci/test/00_setup_env_native_alpine_musl.sh'

          - name: 'tidy'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_tidy.sh'

          - name: 'TSan'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 180
            file-env: './ci/test/00_setup_env_native_tsan.sh'

          - name: 'MSan, fuzz'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 360
            file-env: './ci/test/00_setup_env_native_fuzz_with_msan.sh'

          - name: 'MSan'
            warp-runner: 'warp-ubuntu-latest-x64-16x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 180
            file-env: './ci/test/00_setup_env_native_msan.sh'

    steps:
      - *ANNOTATION_PR_NUMBER

      - *CHECKOUT

      - name: Use the frozen QA corpus revision
        if: ${{ matrix.replay-args }}
        env:
          QA_ASSETS_COMMIT: ${{ needs.runners.outputs.qa-assets-commit }}
        run: |
          if [[ ! "$QA_ASSETS_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve the QA corpus revision for this run"
            exit 1
          fi
          echo "QA_ASSETS_COMMIT=$QA_ASSETS_COMMIT" >> "$GITHUB_ENV"

      - name: Configure environment
        uses: ./.github/actions/configure-environment

      - name: Restore caches
        id: restore-cache
        uses: ./.github/actions/cache/restore
        with:
          provider: ${{ matrix.provider || needs.runners.outputs.provider }}

      - name: Probe 32-bit ARM execution
        if: ${{ env.ARMHF_PROBE_IMAGE != '' }}
        id: armhf
        run: |
          docker pull --platform linux/arm/v7 "$ARMHF_PROBE_IMAGE"
          if ! docker run --rm --platform linux/arm/v7 "$ARMHF_PROBE_IMAGE" /usr/bin/true; then
            echo 'emulate=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Enable 32-bit ARM emulation
        if: ${{ steps.armhf.outputs.emulate == 'true' }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
          image: mirror.gcr.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Check 32-bit ARM subprocesses
        if: ${{ env.ARMHF_PROBE_IMAGE != '' }}
        run: |
          docker run --rm --platform linux/arm/v7 "$ARMHF_PROBE_IMAGE" \
            /bin/sh -ec 'test "$(/usr/bin/dpkg --print-architecture)" = armhf'

      - name: Configure Docker
        uses: ./.github/actions/configure-docker
        with:
          provider: ${{ matrix.provider || needs.runners.outputs.provider }}

      - name: Clear unnecessary files
        if: ${{ needs.runners.outputs.provider == 'gha' && true || false }} # Only needed on GHA runners
        uses: ./.github/actions/clear-files

      - name: Enable bpfcc script
        if: ${{ env.CONTAINER_NAME == 'ci_native_asan' }}
        # In the image build step, no external environment variables are available,
        # so any settings will need to be written to the settings env file:
        run: sed -i "s|\${INSTALL_BCC_TRACING_TOOLS}|true|g" ./ci/test/00_setup_env_native_asan.sh

      - name: Set mmap_rnd_bits
        if: ${{ env.CONTAINER_NAME == 'ci_native_tsan' || env.CONTAINER_NAME == 'ci_native_msan' || env.CONTAINER_NAME == 'ci_native_fuzz_msan' }}
        # Prevents crashes due to high ASLR entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: CI script
        run: ./ci/test_run_all.sh

      - name: Save caches
        if: ${{ !matrix.cache-restore-only }}
        uses: ./.github/actions/cache/save
        with:
          provider: ${{ matrix.provider || needs.runners.outputs.provider }}

  lint:
    name: 'lint'
    needs: runners
    runs-on: ${{ needs.runners.outputs.provider == 'warp' && 'warp-ubuntu-latest-x64-2x' || 'ubuntu-latest' }}
    if: ${{ vars.SKIP_BRANCH_PUSH != 'true' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 20
    env:
      CONTAINER_NAME: "bitcoin-linter"
    steps:
      - *ANNOTATION_PR_NUMBER

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: *CHECKOUT_REF_TMPL
          fetch-depth: 0

      - name: Configure Docker
        uses: ./.github/actions/configure-docker
        with:
          provider: ${{ needs.runners.outputs.provider }}

      - name: CI script
        run: |
          git worktree add ../lint-worktree HEAD
          ../lint-worktree/ci/lint.py
