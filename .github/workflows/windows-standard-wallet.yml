name: Windows package saved wallet check
'on':
  push:
    branches:
    - qa/windows-standard-wallet-report-20261121
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  CI_FAILFAST_TEST_LEAVE_DANGLING: '1'
jobs:
  packages:
    name: Build Windows wallet package, ${{ matrix.crt }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crt:
        - msvcrt
        - ucrt
        include:
        - crt: msvcrt
          file-env: ./ci/test/00_setup_env_win64_msvcrt.sh
          artifact-name: x86_64-w64-mingw32-executables
        - crt: ucrt
          file-env: ./ci/test/00_setup_env_win64.sh
          artifact-name: x86_64-w64-mingw32ucrt-executables
    env:
      FILE_ENV: ${{ matrix.file-env }}
      DANGER_CI_ON_HOST_FOLDERS: 1
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: 4bc5009346decdbe3c5a54252a52a20a679636c8
        persist-credentials: false
    - name: Confirm the release source
      run: test "$(git rev-parse HEAD)" = 4bc5009346decdbe3c5a54252a52a20a679636c8
    - name: Configure environment
      uses: ./.github/actions/configure-environment
    - name: Restore caches
      id: restore-cache
      uses: ./.github/actions/cache/restore
      with:
        provider: gha
    - name: Configure Docker
      uses: ./.github/actions/configure-docker
      with:
        provider: gha
    - name: CI script
      run: ./ci/test_run_all.sh
    - name: Save caches
      uses: ./.github/actions/cache/save
      with:
        provider: gha
    - name: Upload built executables
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact-name }}-${{ github.run_id }}
        path: |
          ${{ env.BASE_BUILD_DIR }}/bin/*.dll
          ${{ env.BASE_BUILD_DIR }}/bin/*.exe
          ${{ env.BASE_BUILD_DIR }}/src/secp256k1/bin/*.exe
          ${{ env.BASE_BUILD_DIR }}/src/univalue/*.exe
          ${{ env.BASE_BUILD_DIR }}/test/config.ini
          ${{ env.BASE_BUILD_DIR }}/*-win64-setup.exe
          ${{ env.BASE_BUILD_DIR }}/windows-installer-path.txt
  wallet:
    name: Test new Windows wallet package, ${{ matrix.crt }}
    runs-on: windows-2022
    needs:
    - packages
    strategy:
      fail-fast: false
      matrix:
        crt:
        - msvcrt
        - ucrt
        include:
        - crt: msvcrt
          artifact-name: x86_64-w64-mingw32-executables
        - crt: ucrt
          artifact-name: x86_64-w64-mingw32ucrt-executables
    env:
      PYTHONUTF8: 1
      TEST_RUNNER_TIMEOUT_FACTOR: 40
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: 4bc5009346decdbe3c5a54252a52a20a679636c8
        persist-credentials: false
    - name: Confirm the release source
      run: test "$(git rev-parse HEAD)" = 4bc5009346decdbe3c5a54252a52a20a679636c8
    - name: Download built executables
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.artifact-name }}-${{ github.run_id }}
    - name: Run sugarchaind.exe
      run: py -3 .github/ci-windows-cross.py print_version
    - name: Import Visual Studio env vars
      run: py -3 .github/ci-windows.py "standard" github_import_vs_env
    - name: Check executable manifests
      run: py -3 .github/ci-windows-cross.py check_manifests
    - name: Prepare Windows test environment
      run: py -3 .github/ci-windows-cross.py prepare_tests
    - name: Run native network, GUI and wallet smoke checks
      run: py -3 .github/ci-windows-smoke.py --bindir bin --work-dir "${RUNNER_TEMP}/en-cross-smoke-${{ matrix.crt }}"
    - name: Reopen a saved wallet in the native GUI
      run: py -3 .github/ci-windows-smoke.py --verify-wallet-restart --bindir bin --work-dir "${RUNNER_TEMP}/en-cross-wallet-restart-${{ matrix.crt }}"
    - name: Verify installed applications and installer lifecycle
      run: |
        py -3 .github/ci-windows-installer.py --with-wallet-restart \
          --installer "$(basename "$(cat windows-installer-path.txt)")" \
          --work-dir "${RUNNER_TEMP}/en-installer-${{ matrix.crt }}"
    - name: Save the wallet and installer receipts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: windows-wallet-receipts-${{ matrix.crt }}-${{ github.run_id }}
        if-no-files-found: warn
        path: |-
          ${{ runner.temp }}/en-cross-smoke-${{ matrix.crt }}/results.json
          ${{ runner.temp }}/en-cross-wallet-restart-${{ matrix.crt }}/wallet-restart-results.json
          ${{ runner.temp }}/en-installer-${{ matrix.crt }}/installer-results.json
          ${{ runner.temp }}/en-installer-${{ matrix.crt }}/installed-runtime/results.json
          ${{ runner.temp }}/en-installer-${{ matrix.crt }}/installed-wallet-restart/wallet-restart-results.json
